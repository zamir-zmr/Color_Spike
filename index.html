<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            touch-action: none; /* Screen ko hilne se rokne ke liye */
        }
        canvas { display: block; }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let particlesArray = [];
    let hue = 0;

    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 10 + 2;
            this.speedX = Math.random() * 4 - 2;
            this.speedY = Math.random() * 4 - 2;
            this.color = 'hsl(' + hue + ', 100%, 50%)';
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.size > 0.1) this.size -= 0.15;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function handleInput(e) {
        // Agar touch hai toh touches use karega, nahi toh mouse coordinates
        let x = e.touches ? e.touches[0].clientX : e.clientX;
        let y = e.touches ? e.touches[0].clientY : e.clientY;
        
        for (let i = 0; i < 5; i++) {
            particlesArray.push(new Particle(x, y));
        }
    }

    // Touch aur Mouse dono events yahan hain
    window.addEventListener('mousemove', handleInput);
    window.addEventListener('touchmove', (e) => {
        e.preventDefault(); // Screen scroll hone se rokega
        handleInput(e);
    }, { passive: false });

    // Click par bhi chale
    window.addEventListener('mousedown', handleInput);
    window.addEventListener('touchstart', handleInput);

    function animate() {
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        for (let i = 0; i < particlesArray.length; i++) {
            particlesArray[i].update();
            particlesArray[i].draw();
            
            if (particlesArray[i].size <= 0.2) {
                particlesArray.splice(i, 1);
                i--;
            }
        }
        hue += 5; 
        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
